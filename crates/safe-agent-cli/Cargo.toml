[package]
name = "safe-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A local policy-driven sandbox supervisor for coding agents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

